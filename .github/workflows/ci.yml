name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (offline, mocked Octopus API; no credentials)
        run: python -m pytest tests -q
        env:
          PYTHONPATH: server:server/vendor
      - name: Generated files up to date
        run: |
          python scripts/build_manifests.py
          python scripts/build_postman.py
          python scripts/build_docs.py
          python scripts/build_agents.py
          git diff --exit-code -- postman mcp.json plugin.json .cursor-plugin .claude-plugin server.json docs/TOOLS.md docs/TOOLS.nl.md docs/EXPORT-SCHEMA.md agents .github/agents
